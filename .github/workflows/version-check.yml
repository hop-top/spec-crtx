name: version-check

# Guard over release-version literals and spec version paths: annotated
# literals equal the manifest, annotated files and `extra-files` are one
# set, no stray version literal, every `specs/vX.Y` path names a manifest
# version. The rules and the script live in hop-top/.github.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    uses: hop-top/.github/.github/workflows/version-check.yml@v0
